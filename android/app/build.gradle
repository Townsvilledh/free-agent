plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

// X identity kit (v0.10.1, XLANE.md "Hers alone"): Lille's own
// X identity (handles, bio, DOB, mailbox ladder) is injected
// at build time from the CI environment — the official
// workflow populates it from the repo's Actions secrets
// (LILLE_X_KIT_*), the same mechanism as the signing key.
// The values never live in this source tree: without the
// environment (local dev, forks) they default to EMPTY, the
// build is hollow, and the owner-gated X-account task reports
// itself unavailable. Values are escaped into Java string
// literals for the generated BuildConfig.
def lilleKitField = { String envName ->
    def v = (System.getenv(envName) ?: "")
        .replace("\\", "\\\\").replace("\"", "\\\"")
        .replace("\n", "\\n").replace("\r", "")
    return "\"${v}\""
}

android {
    namespace "org.freeagent.app"
    compileSdk 34

    defaultConfig {
        applicationId "org.freeagent.app"
        minSdk 29          // Android 10 — the Galaxy A12's floor
        targetSdk 34
        versionCode 17
        versionName "0.12.1"
        // The WalletConnect SDK (v0.10) takes the app past one
        // dex; minSdk 29 (ART) runs multidex natively, this just
        // lets Gradle emit it.
        multiDexEnabled true
        // AppAuth's RedirectUriReceiverActivity declares its redirect
        // scheme via this placeholder; the manifest merger fails without it.
        manifestPlaceholders = [appAuthRedirectScheme: "org.freeagent.app"]
        // Identity kit injection (see lilleKitField above).
        buildConfigField "String", "X_KIT_HANDLES", lilleKitField("LILLE_X_KIT_HANDLES")
        buildConfigField "String", "X_KIT_BIO", lilleKitField("LILLE_X_KIT_BIO")
        buildConfigField "String", "X_KIT_DOB", lilleKitField("LILLE_X_KIT_DOB")
        buildConfigField "String", "X_KIT_MAILBOXES", lilleKitField("LILLE_X_KIT_MAILBOXES")
        // Backup Layer 2 (v0.11, BACKUP.md): the Google Drive
        // appDataFolder sync code ships complete but DISABLED
        // until the Google Cloud OAuth client for this app
        // (package + stable signing cert fingerprint) exists
        // and the repo variable LILLE_DRIVE_ENABLED is set to
        // "true" in CI. Disabled builds never attempt a Google
        // sign-in.
        buildConfigField "boolean", "DRIVE_ENABLED",
            (System.getenv("LILLE_DRIVE_ENABLED") == "true") ? "true" : "false"
        // APK size (v0.11): the WalletConnect stack's only
        // native library (sqlcipher) ships for four ABIs; the
        // x86 pair serves emulators, not phones. Keep the two
        // phone ABIs — arm64-v8a (every modern phone, incl.
        // the Galaxy A12) and armeabi-v7a (legacy 32-bit).
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    // Stable signing line (v0.9.2+, see SIGNING.md): when the build
    // environment provides LILLE_KEYSTORE_FILE (CI decodes it from the
    // LILLE_KEYSTORE_B64 Actions secret), the debug build is signed
    // with Lille's dedicated keystore, so every release carries the
    // SAME certificate and installs OVER the previous version.
    // Without it (local dev, fork PRs) Gradle's default debug key is
    // used, exactly as before.
    signingConfigs {
        if (System.getenv("LILLE_KEYSTORE_FILE")) {
            lille {
                storeFile file(System.getenv("LILLE_KEYSTORE_FILE"))
                storePassword System.getenv("LILLE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("LILLE_KEY_ALIAS") ?: "lille"
                keyPassword System.getenv("LILLE_KEY_PASSWORD")
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv("LILLE_KEYSTORE_FILE")) {
                signingConfig signingConfigs.lille
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    buildFeatures { viewBinding true; buildConfig true }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    // Vault: Keystore-backed encrypted storage (see APP.md security map)
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    // Background jobs that respect Doze
    implementation "androidx.work:work-runtime-ktx:2.9.0"
    // Gmail OAuth (gmail.readonly) via AppAuth
    implementation "net.openid:appauth:0.11.1"
    // HTTP to the free provider APIs (keyless Pollinations by default;
    // optional personal AgentRouter / Groq keys if the user adds their own)
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    // v0.10: WalletConnect dapp side of the Fluid login gate
    // (LOGIN.md) — the official Kotlin SDK. sign 2.21.0 is the
    // last WalletConnect-branded release; it is built against
    // Kotlin stdlib 1.8.21, so it compiles cleanly under this
    // project's Kotlin 1.9.24 (the Reown-branded 1.6.x line is
    // built against Kotlin 2.4 metadata). android-core is the
    // version sign 2.21.0's own POM pairs it with.
    implementation "com.walletconnect:android-core:1.23.0"
    implementation "com.walletconnect:sign:2.21.0"
    // v0.11: Google sign-in for the Drive appDataFolder backup
    // layer (BACKUP.md) — sign-in + token only; the Drive REST
    // calls themselves are plain HTTPS in DriveBackup.kt.
    implementation "com.google.android.gms:play-services-auth:21.2.0"
    // JVM unit tests (task state machine — pure Kotlin, no device needed)
    testImplementation "junit:junit:4.13.2"
    // Real org.json for JVM unit tests: android.jar's copy is a stub
    // whose methods throw RuntimeException("Stub!") off-device.
    testImplementation "org.json:json:20240303"
}
