name: bisect-tests

# TEMPORARY (1.0.8 CI diagnosis): runs the Android unit-test
# suites in per-suite jobs so a failure names its suite via
# the job conclusion (job logs are not readable through the
# connector). Delete this file once the failure is found.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - BrainPacingTest
          - BrowserPanelTest
          - ChatWorkMarkTest
          - HeartbeatTest
          - Lille104Test
          - MascotStatesTest
          - MissionLogTest
          - NarrationGuardTest
          - ProactivePassTest
          - RouteRestTest
          - TaskToolsTest
          - TaskWatchdogTest
          - XConnectTaskTest
          - Lille108Test
    name: suite-${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Run one suite
        working-directory: android
        run: gradle testDebugUnitTest --tests "org.freeagent.app.${{ matrix.suite }}"
