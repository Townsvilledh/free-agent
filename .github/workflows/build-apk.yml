name: build-apk

# Builds the FreeAgent debug APK for free on a public-repo runner
# (Java + Android SDK are preinstalled on ubuntu-latest), and runs the
# Python core tests in the same workflow. No secrets are used here:
# debug builds sign with the standard debug key. Release signing with
# Ethuram's own keystore (kept in the vault) is a later, opt-in step.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "free_agent/**"
      - "tests/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "free_agent/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python core tests
        run: python -m unittest discover tests -v

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Run Android unit tests
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: freeagent-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
