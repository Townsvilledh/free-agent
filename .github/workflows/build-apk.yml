name: build-apk

# Builds the FreeAgent debug APK for free on a public-repo runner
# (Java + Android SDK are preinstalled on ubuntu-latest), and runs the
# Python core tests in the same workflow.
#
# Signing (v0.9.2+, see SIGNING.md): the APK is signed with Lille's
# dedicated keystore, restored below from the LILLE_KEYSTORE_B64
# Actions secret, so every build carries the SAME certificate and
# installs OVER the installed app. (Before v0.9.2 each run signed
# with the runner's fresh throwaway debug key, which forced a full
# uninstall — and a data wipe — on every update.) When the secret is
# unavailable (e.g. a fork PR), the build falls back to the runner's
# debug key and says so in the log. A production release key remains
# a later, opt-in step.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "free_agent/**"
      - "tests/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "free_agent/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python core tests
        # pipefail: the tee must not mask the suite's exit code.
        # The log is uploaded below (if: always()) so a CI-only
        # failure is readable off-runner.
        run: |
          set -o pipefail
          python -m unittest discover tests -v 2>&1 | tee python-tests.log

      - name: Upload Python test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-tests-log
          path: python-tests.log
          if-no-files-found: ignore

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Run Android unit tests
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace

      - name: Restore Lille signing keystore (stable signing line)
        run: |
          if [ -n "${{ secrets.LILLE_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.LILLE_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/lille-signing.p12"
            echo "LILLE_KEYSTORE_FILE=$RUNNER_TEMP/lille-signing.p12" >> "$GITHUB_ENV"
            echo "Keystore restored — this APK carries the stable Lille signing certificate."
          else
            echo "No LILLE_KEYSTORE_B64 secret available (e.g. fork PR) — falling back to the runner's throwaway debug key; this build will NOT install over a stable-line build."
          fi

      - name: Build debug APK
        working-directory: android
        env:
          LILLE_KEYSTORE_PASSWORD: ${{ secrets.LILLE_KEYSTORE_PASSWORD }}
          LILLE_KEY_ALIAS: ${{ secrets.LILLE_KEY_ALIAS }}
          LILLE_KEY_PASSWORD: ${{ secrets.LILLE_KEY_PASSWORD }}
          # X identity kit (v0.10.1): injected into BuildConfig by
          # Gradle from these env vars. Absent (forks) -> empty ->
          # the owner-gated X-account task is unavailable there.
          LILLE_X_KIT_HANDLES: ${{ secrets.LILLE_X_KIT_HANDLES }}
          LILLE_X_KIT_BIO: ${{ secrets.LILLE_X_KIT_BIO }}
          LILLE_X_KIT_DOB: ${{ secrets.LILLE_X_KIT_DOB }}
          LILLE_X_KIT_MAILBOXES: ${{ secrets.LILLE_X_KIT_MAILBOXES }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: freeagent-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
