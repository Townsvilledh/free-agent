name: bisect-108

# TEMPORARY (1.0.8 CI diagnosis): Lille108Test fails under
# gradle but passes in the local harness. One job per method
# so the failing method names itself via the job conclusion.
# Delete once found.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  method:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        method:
          - stateSheetStatesTheFalseFinishAsNotStanding
          - stateSheetCarriesTheAccountsRegistry
          - completionQuestionResolvesAndCrossChecks
          - accountabilityResolvesAndTellsTheRecordStory
          - standQuestionResolvesToTheCrossCheckedStatus
          - browserQuestionResolvesToTheRestingPage
          - didItFinishResolvesAsCompletion
          - jobShapedLookalikesAreNotIntercepted
          - loginAssertionResolvesToTheStamp
          - loginAnswerNamesHisAccountOnHerCreationLane
          - loginJobsAreNotIntercepted
          - finishGateCriteriaJudgeFromState
          - auditReopenStampsTheCorrection
          - profileUrlMatchingIsExact
          - coherenceSweepAcrossAllStates
          - theFalseFinishReportCarriesNoWaitingTrailer
          - statusDenialFixturesAreBlocked
          - worldStateDenialsPass
          - phasesAdvanceOnlyForwardAndResumeAtTheFirstGap
          - mailboxSwitchNeedsRecordedEvidenceAndWorksOnce
          - loopBreakerTripsOnTheMailboxCircle
          - loopClustersNameTheGround
          - registrySeparatesAccountsAndTracksTheActiveOne
          - registryMergeKeepsTheLocalActiveTruth
          - accountsQuestionsResolveAndJobsDoNot
          - handbackAnnouncementsComeFromThePage
          - ownerForSeparatesHersHisAndUnknown
    name: m-${{ matrix.method }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Run one method
        working-directory: android
        run: gradle testDebugUnitTest --tests "org.freeagent.app.Lille108Test.${{ matrix.method }}"
